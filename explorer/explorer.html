<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillFabri — SE Agent Skill Market</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="description" content="Browse the software-engineering agent-skill market by activity and capability, and open any skill's relation graph.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#F8F7F1;--panel:#FFFFFF;--panel2:#FAF9F5;--ink:#141414;--ink2:#4D4D4D;--muted:#9A9A9A;--line:rgba(0,0,0,0.08);--line2:rgba(0,0,0,0.05);
  --accent:#2847E0;--accent-soft:rgba(40,71,224,0.07);--same:#E8590C;--inter:#14B8A6;--contain:#2847E0;--fav:#E84040;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:'Inter',ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:'Bricolage Grotesque',var(--sans);
  /* One motion vocabulary. The spring is what makes a panel feel placed rather than moved;
     the plain ease is for colour and opacity, where overshoot would look like a glitch. */
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --hh:56px;                                  /* header height — #skillpage and .rail derive from it */
  --esame:#D2703A;--einter:#2F8E80;--econtain:#5566C0;
  --nfill:0.24;--nfillc:0.40;--nhalo:0.12;--nstroke:1;
  --shadow:0 1px 3px rgba(20,20,20,.06),0 8px 28px rgba(20,20,20,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17171C;--panel:#212128;--panel2:#1C1C22;--ink:#ECECF2;--ink2:#B4BAC8;--muted:#7A7A86;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.05);
  --accent:#7A8DF2;--accent-soft:rgba(122,141,242,0.14);--same:#F2874A;--inter:#1FBE9C;--contain:#7A8DF2;--fav:#EE5555;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.34);
}}
:root[data-theme=dark]{
  --bg:#17171C;--panel:#212128;--panel2:#1C1C22;--ink:#ECECF2;--ink2:#B4BAC8;--muted:#7A7A86;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.05);
  --accent:#7A8DF2;--accent-soft:rgba(122,141,242,0.14);--same:#F2874A;--inter:#1FBE9C;--contain:#7A8DF2;--fav:#EE5555;
  /* edges get their own, deliberately duller palette — chips and legend keep the saturated one */
  --esame:#C4753F;--einter:#3F9385;--econtain:#6B77BC;
  --nfill:0.15;--nfillc:0.28;--nhalo:0.075;--nstroke:0.72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.34);
}
:root[data-theme=light]{
  --bg:#F8F7F1;--panel:#FFFFFF;--panel2:#FAF9F5;--ink:#141414;--ink2:#4D4D4D;--muted:#9A9A9A;--line:rgba(0,0,0,0.08);--line2:rgba(0,0,0,0.05);
  --accent:#2847E0;--accent-soft:rgba(40,71,224,0.07);--same:#E8590C;--inter:#14B8A6;--contain:#2847E0;--fav:#E84040;
  --esame:#D2703A;--einter:#2F8E80;--econtain:#5566C0;
  --nfill:0.24;--nfillc:0.40;--nhalo:0.12;--nstroke:1;
  --shadow:0 1px 3px rgba(20,20,20,.06),0 8px 28px rgba(20,20,20,.07);
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:14.5px;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}.mono{font-family:var(--mono)}.tnum{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:32px;height:var(--hh);padding:0 26px}
@media(max-width:760px){.bar{padding:0 18px;gap:20px}}
/* Below this the four nav items plus the wordmark need ~450px and the bar is a non-wrapping
   flex row, so they were being clipped off the right edge — invisible, not merely cramped.
   The mark alone still identifies the site, so the word goes and the row scrolls if it must. */
/* Four labels do not fit beside the wordmark on a phone, and neither shrinking them nor giving
   them their own row survived contact with a real device. A menu removes the constraint instead
   of negotiating with it: the header stays one row at any width, and the items stack. */
.navtgl{display:none;background:none;border:1px solid var(--line);border-radius:9px;
  width:34px;height:32px;cursor:pointer;color:var(--ink2);place-items:center;flex:none;
  transition:color .15s,border-color .15s}
.navtgl:hover,.navtgl[aria-expanded=true]{color:var(--accent);border-color:var(--accent)}
@media(max-width:680px){
  .bar{gap:12px;padding:0 14px}
  .bartools{gap:7px}                        /* matches the landing page at this width */
  .themetgl{width:28px;height:28px}
  .navtgl{display:grid}
  nav{position:absolute;top:calc(var(--hh) - 5px);left:12px;right:12px;z-index:60;
    display:none;flex-direction:column;align-items:stretch;gap:2px;
    background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px;
    box-shadow:0 12px 32px rgba(0,0,0,.22)}
  nav.open{display:flex}
  nav button{width:100%;text-align:left;font-size:14.5px;padding:12px 13px;border-radius:9px}
  nav button.on{background:var(--accent-soft)}
  nav button:active{background:var(--line2)}
}
@media(max-width:360px){.wm{display:none}}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .wm{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.brand .wm b{color:var(--accent);font-weight:800}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px 9px 38px;color:var(--ink);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
nav{display:flex;align-items:center;gap:24px}
nav button{background:none;border:0;padding:0;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink2);
  cursor:pointer;white-space:nowrap;transition:color .15s}
nav button:hover{color:var(--ink)}
/* the active page is marked by colour alone — no pill, no background */
nav button.on{color:var(--accent)}
#signin{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,16,.55);padding:22px;backdrop-filter:blur(3px)}
#signin.on{display:flex}
.who{display:inline-flex;align-items:center;gap:9px;flex:none;order:2}
/* the pair travels together at the landing page's 9px, not the bar's 32px nav gap */
.bartools{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.whobtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;padding:0;overflow:hidden;display:grid;place-items:center;color:var(--ink2);
  transition:border-color .15s}
.whobtn:hover{border-color:var(--accent)}
.whobtn img{width:100%;height:100%;object-fit:cover;display:block}
.whoin{font-family:var(--sans);font-size:13px;font-weight:700;text-transform:uppercase}
.whobtn.signin{width:auto;border-radius:9px;padding:0 15px;height:32px;font-family:var(--sans);
  font-size:12.5px;font-weight:600;background:var(--accent);border-color:var(--accent);color:#fff;
  white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.whobtn.signin:hover{filter:brightness(1.08)}
.prov{display:flex;flex-direction:column;align-items:center;gap:10px}
.prov>div{display:flex;justify-content:center}
.ghbtn{display:flex;align-items:center;justify-content:center;gap:10px;
  width:280px;height:40px;box-sizing:border-box;border-radius:20px;
  background:#24292F;color:#fff;text-decoration:none;
  font-family:var(--sans);font-size:14px;font-weight:500;transition:filter .15s}
.ghbtn:hover{filter:brightness(1.25)}
.upbtn{background:var(--accent);border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:500}
.upbtn:hover{filter:brightness(1.1)}
:root[data-theme=dark] .ghbtn{background:#30363D}
.who{position:relative}
.whomenu{position:absolute;top:calc(100% + 9px);right:0;z-index:80;min-width:212px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:6px;
  box-shadow:0 16px 40px rgba(0,0,0,.22);opacity:0;transform:translateY(-6px) scale(.97);
  pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease)}
.whomenu.on{opacity:1;transform:none;pointer-events:auto}
.whohead{padding:9px 11px 10px;border-bottom:1px solid var(--line2);margin-bottom:5px}
.whonm{font-size:13.5px;font-weight:600;line-height:1.3}
.whoem{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis}
.whovia{font-family:var(--mono);font-size:10px;color:var(--muted);opacity:.75;margin-top:3px}
.whoitem{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;color:var(--ink2);padding:9px 11px;border-radius:8px;
  transition:background .12s,color .12s}
.whoitem:hover{background:var(--line2);color:var(--ink)}
.whoitem.danger:hover{color:var(--fav)}

/* ---- motion ----------------------------------------------------------------
   Three moves, used everywhere, so the interface behaves the same way twice.
   A panel scales in from where it was opened. A list arrives in sequence, which
   reads as order rather than as a flash. Nothing animates for a reader who has
   asked their system not to.                                                  */
@keyframes sf-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sf-pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sf-fade{from{opacity:0}to{opacity:1}}

/* modal: the backdrop fades, the card springs. Doing both to both reads as a jump. */
#infomodal.on,#signin.on{animation:sf-fade .16s var(--ease-out) both}
#infomodal.on>.imcard,#signin.on>.imcard{animation:sf-pop .26s var(--ease) both}

/* results and value cards arrive in sequence; only the first rows, since a stagger
   that runs past the fold is a delay nobody sees the start of */
.grid>.card,.vgrid>.vcard{animation:sf-in .34s var(--ease-out) both}
.grid>.card:nth-child(n+13),.vgrid>.vcard:nth-child(n+13){animation-delay:0s}
.grid>.card:nth-child(1),.vgrid>.vcard:nth-child(1){animation-delay:.01s}
.grid>.card:nth-child(2),.vgrid>.vcard:nth-child(2){animation-delay:.03s}
.grid>.card:nth-child(3),.vgrid>.vcard:nth-child(3){animation-delay:.05s}
.grid>.card:nth-child(4),.vgrid>.vcard:nth-child(4){animation-delay:.07s}
.grid>.card:nth-child(5),.vgrid>.vcard:nth-child(5){animation-delay:.09s}
.grid>.card:nth-child(6),.vgrid>.vcard:nth-child(6){animation-delay:.11s}
.grid>.card:nth-child(7),.vgrid>.vcard:nth-child(7){animation-delay:.13s}
.grid>.card:nth-child(8),.vgrid>.vcard:nth-child(8){animation-delay:.15s}
.grid>.card:nth-child(9),.vgrid>.vcard:nth-child(9){animation-delay:.17s}
.grid>.card:nth-child(10),.vgrid>.vcard:nth-child(10){animation-delay:.19s}
.grid>.card:nth-child(11),.vgrid>.vcard:nth-child(11){animation-delay:.21s}
.grid>.card:nth-child(12),.vgrid>.vcard:nth-child(12){animation-delay:.23s}

/* the relation list and the skill page */
.relsec{animation:sf-in .3s var(--ease-out) both}
.relsec:nth-child(2){animation-delay:.05s}
.relsec:nth-child(3){animation-delay:.1s}
#skillpage.on{animation:sf-in .3s var(--ease) both}
.vtiles{animation:sf-fade .25s var(--ease-out) both}

/* a card lifts under the cursor and settles back; the press is the confirmation */
.card{transition:border-color .16s,transform .18s var(--ease-out),box-shadow .18s var(--ease-out)}
.card:hover{transform:translateY(-2px)}
.card:active,.vcard:active{transform:translateY(0) scale(.995);transition-duration:.06s}
.btn,.lobrowse,.vmore,.imsrc,.themetgl,.whobtn{transition:background .15s,border-color .15s,
  color .15s,transform .14s var(--ease-out),filter .15s}
.btn:active,.lobrowse:active,.vmore:active,.imsrc:active,.themetgl:active{transform:scale(.97)}
.seg button{transition:background .15s,color .15s}
.relrow{transition:background .13s,padding-left .13s}
.relrow:hover{padding-left:10px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;
    transition-duration:.01ms !important}
}
.themetgl{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);flex:none;
  background:var(--panel);color:var(--ink2);cursor:pointer;font-size:14px;line-height:1;
  display:grid;place-items:center;transition:color .15s,border-color .15s}
.themetgl:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1660px;margin:0 auto}
.pad{padding:26px}
.vic{display:inline-flex;align-items:center}
.lcount{font-family:var(--mono);font-size:11.5px;color:var(--ink2);font-weight:500;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
/* the search lives with the results now, not in the top bar */
.brsearch{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;margin:0 0 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);color:var(--muted)}
.brsearch:focus-within{border-color:rgba(40,71,224,.4)}
.brsearch input{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);outline:none}
.brsearch input::placeholder{color:var(--muted)}
.view{display:none}.view.on{display:block}
h1,h2,.brand,.dhead h2,.imhead h2,.sptitle{font-family:var(--display)}
h1{font-size:27px;letter-spacing:-.03em;margin:0 0 6px;font-weight:800;text-wrap:balance}
.lede{color:var(--ink2);font-size:15px;max-width:82ch;margin:0 0 20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:32px 0 13px;font-weight:500}
/* ---- HERO (legacy, kept for non-overview uses) ---- */
.hero{position:relative;height:min(74vh,680px);overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(120% 90% at 50% -10%,var(--accent-soft),transparent 60%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.heroover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;pointer-events:none;z-index:2}
.heroover .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;opacity:0;animation:rise .7s .1s forwards}
.heroover h1{font-size:clamp(30px,5vw,58px);line-height:1.04;margin:0;max-width:16ch;letter-spacing:-.03em;opacity:0;animation:rise .8s .2s forwards}
.heroover p{font-size:clamp(15px,1.6vw,19px);color:var(--ink2);max-width:52ch;margin:18px 0 0;opacity:0;animation:rise .8s .35s forwards}
.herostat{display:flex;gap:30px;margin-top:26px;pointer-events:auto;opacity:0;animation:rise .8s .5s forwards;flex-wrap:wrap}
.herostat div{display:flex;flex-direction:column}
.herostat b{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.herostat span{font-size:12px;color:var(--muted)}
.herohint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);z-index:2;opacity:0;animation:rise 1s .8s forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ---- Overview hero ---- */

.view-body{padding:0 28px 40px}
.sf-hero{padding:44px 28px 32px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.sf-hero::before{content:'';position:absolute;right:-8%;top:-40%;width:55%;height:160%;background:radial-gradient(ellipse at center,rgba(40,71,224,0.05) 0%,transparent 65%);pointer-events:none}
.sf-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(40,71,224,0.18);padding:5px 12px;border-radius:100px;margin-bottom:18px}
.sf-pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:sf-pulse-anim 2s ease-in-out infinite;flex-shrink:0}
@keyframes sf-pulse-anim{0%,100%{opacity:1}50%{opacity:.3}}
.sf-hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.5vw,3.5rem);letter-spacing:-0.03em;line-height:1.04;margin:0 0 16px}
.sf-hero .lede{font-size:15px;line-height:1.75;max-width:56ch;color:var(--ink2);margin-bottom:28px}
.sf-stats{display:flex;gap:36px;flex-wrap:wrap}
.sf-stats div{display:flex;flex-direction:column}
.sf-stats b{font-family:var(--display);font-size:1.7rem;font-weight:800;letter-spacing:-0.03em;color:var(--ink)}
.sf-stats span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card .top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.card .nm{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pop{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}.card .pop b{color:var(--inter)}
.card .sum{font-size:12.8px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.act{color:#fff;border:0}.tag.cap{color:var(--ink)}
.favb{background:none;border:0;cursor:pointer;font-size:16px;color:var(--muted);line-height:1;opacity:.55;padding:0 0 0 2px;flex-shrink:0}
#spfav{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:0;opacity:1;margin-left:auto;
  color:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:6px 13px;display:inline-flex;
  align-items:center;gap:6px;transition:color .13s,border-color .13s,background .13s}
#spfav:hover{color:var(--fav);border-color:var(--fav)}
#spfav.on{color:var(--fav);border-color:color-mix(in srgb,var(--fav) 45%,transparent);
  background:color-mix(in srgb,var(--fav) 10%,transparent)}
.favb.on{color:var(--fav);opacity:1}.card:hover .favb{opacity:1}
/* ---- browse (dimension picker) ---- */
.browse{display:grid;grid-template-columns:190px minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:820px){.browse{grid-template-columns:1fr}}
.brmain{min-width:0;overflow-wrap:anywhere}
.rail{position:sticky;top:calc(var(--hh) + 22px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - var(--hh) - 44px)}
.seg{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{background:none;border:0;color:var(--ink2);font:inherit;font-size:13px;font-weight:500;
  padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;text-align:left;width:100%}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.seg button:hover:not(.on){color:var(--ink)}
.vfilter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);font:inherit;font-size:13px}
.vfilter:focus{outline:none;border-color:rgba(40,71,224,.35);box-shadow:0 0 0 3px var(--accent-soft)}
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:12px}
.vgrid.noic{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.vcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;

.listhead{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}.listhead h2{font-size:19px;margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.02em}.listhead .n{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

.relsec{margin-top:18px}

.relrow .rn{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.relrow .rs{font-family:var(--mono);font-size:11px;color:var(--muted)}

<script>
const API=p=>fetch(p).then(r=>r.json());
const POST=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const REL={same:'--same',intersect:'--inter',contain:'--contain'};
const RELE={same:'--esame',intersect:'--einter',contain:'--econtain'};   // edge-only, softer
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':(''+(n||0));
const esc=s=>(''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACTCOL=window.SF_ACTCOL||{};   /* defined in /icons.js, shared with the landing page */
const actCol=a=>ACTCOL[a]||'#8a8f9c';
/* Every edge stays inside one activity, so an activity-coloured neighbourhood is a single flat
   colour. Capability is the axis that actually varies inside it. */
const CAPHUE=['#14B8A6','#2847E0','#22C55E','#E8590C','#8B5CF6','#EC4899','#F59E0B','#0EA5C4','#D6455D','#7048E8'];
function capPalette(nodes){const caps=[...new Set(nodes.map(n=>n.capability).filter(Boolean))].sort();
  const m={};caps.forEach((c,i)=>m[c]=CAPHUE[i%CAPHUE.length]);
  return n=>m[n.capability]||actCol(n.activity);}
/* one icon set for the whole product — /icons.js is shared with the landing page */
function actIcon(a,size){const d=(window.SF_ICONS||{})[a]||window.SF_ICON_FALLBACK||'';
  return d?`<svg viewBox="0 0 20 20" fill="none" width="${size||15}" height="${size||15}" style="flex:none">${d}</svg>`:'';}
let DIMS=null,FAVS=new Set(),ME=null,MINE={added:[],favorites:[]};
// Browsing needs no account. Saving does, because a favourite has to belong to somebody —
// before this it belonged to the server, which meant every visitor shared one list.
async function loadMe(){try{ME=await API('/api/me');}catch(e){ME={user:null,login:false};}return ME;}
// Two ways to have an account here: this instance's own session, or a link to the upstream.
// Only the first was counted, so a linked install kept being told to sign in.
function signedIn(){return !!(ME&&(ME.user||ME.linked));}
function whoami(){return ME&&(ME.user||ME.linked)||null;}
function askSignIn(why){
  if(ME&&!ME.login&&!ME.upstream){alert('Sign-in is not configured on this instance.');return;}
  const d=document.getElementById('signin');if(!d)return;
  document.getElementById('signinwhy').textContent=why||'Sign in to keep your own list.';
  const P=(ME&&ME.providers)||{},up=ME&&ME.upstream;
  // A local install borrows the hosted accounts rather than making every user register a
  // Google project and a GitHub app. Its own providers still work if configured.
  document.getElementById('upwrap').style.display=up?'block':'none';
  if(up)document.getElementById('uphint').textContent=
    'Signs you in at ' + up.replace(/^https?:\/\//,'') + ' in a new window. '
    + 'Skills you place here then sync to that account.';
  document.getElementById('ghwrap').style.display=P.github?'block':'none';
  document.getElementById('gbtn').style.display=P.google?'flex':'none';
  const ub=document.getElementById('upbtn');if(ub)ub.onclick=linkUpstream;
  d.classList.add('on');if(P.google)mountGoogle();}
function closeSignIn(){const d=document.getElementById('signin');if(d)d.classList.remove('on');}
// Google's script is only fetched once somebody actually tries to sign in, so a visitor who
// never does is not billed a third-party request.
let _gsi=null;
function mountGoogle(){
  const host=document.getElementById('gbtn');if(!host||!ME||!ME.client_id)return;
  const draw=()=>{if(!window.google||!google.accounts)return;
    google.accounts.id.initialize({client_id:ME.client_id,callback:async r=>{
      const res=await POST('/api/auth/google',{credential:r.credential});
      if(res&&res.ok){ME.user=res.user;closeSignIn();await refreshFavs();
        paintMe();if(viewOn('mine'))renderMine();}
      else alert('Sign-in failed.');}});
    host.innerHTML='';
    google.accounts.id.renderButton(host,{theme:document.documentElement.getAttribute('data-theme')==='dark'?'filled_black':'outline',
      size:'large',shape:'pill',text:'continue_with',width:280});
    // GIS renders nothing at all when the page's origin is not on the client's allowed list,
    // and reports it only to the console — so an unconfigured origin looks like a blank gap.
    // Say what happened instead of leaving the space empty.
    setTimeout(()=>{if(host && !host.firstChild)
      host.innerHTML='<span class="hint" style="line-height:1.5">Google sign-in did not load — '+
        'this page\'s origin may not be registered for the client id.</span>';},2500);};
  if(_gsi){draw();return;}
  _gsi=document.createElement('script');_gsi.src='https://accounts.google.com/gsi/client';
  _gsi.async=true;_gsi.defer=true;_gsi.onload=draw;
  _gsi.onerror=()=>{_gsi=null;host.innerHTML='<span class="hint">Google sign-in could not be '+
    'reached. Continue with GitHub, or try again.</span>';};
  document.head.appendChild(_gsi);}
// the popup does the signing in; this side just waits for the link to appear
async function linkUpstream(){
  const r=await POST('/api/link/start',{});
  if(!r||!r.url){alert('Could not start sign-in.');return;}
  const w=window.open(r.url,'sf-signin','width=520,height=700');
  const t0=Date.now();
  const poll=setInterval(async()=>{
    const m=await API('/api/me').catch(()=>null);
    if(m&&m.linked){clearInterval(poll);ME=m;closeSignIn();paintMe();
      if(w&&!w.closed)try{w.close();}catch(e){}
      if(viewOn('mine'))renderMine();return;}
    if(Date.now()-t0>180000||(w&&w.closed&&Date.now()-t0>2000)){clearInterval(poll);}
  },1200);}
async function signOut(){await POST('/api/auth/logout',{});ME.user=null;FAVS=new Set();
  paintMe();if(viewOn('mine'))renderMine();if(viewOn('browse'))loadList();}
function viewOn(v){const e=document.getElementById('v-'+v);return !!e&&e.classList.contains('on');}
// Sign out used to sit exposed in the bar, one stray click from ending your session next to
// the controls you actually use. It lives under the avatar now, which is also where the account
// it belongs to is identified.
function paintMe(){
  const w=document.getElementById('who');if(!w)return;
  const linked=ME&&ME.linked&&!ME.user, u=whoami();
  if(!u){w.innerHTML=`<button class="whobtn signin" id="whoin">Sign in</button>`;
    document.getElementById('whoin').onclick=()=>askSignIn();return;}
  w.innerHTML=
    `<button class="whobtn" id="whobtn" aria-haspopup="menu" aria-expanded="false" title="${esc(u.email||'')}">`+
      (u.picture?`<img src="${esc(u.picture)}" alt="">`:`<span class="whoin">${esc((u.name||'?')[0])}</span>`)+
    `</button>`+
    `<div class="whomenu" id="whomenu" role="menu">`+
      `<div class="whohead">`+
        `<div class="whonm">${esc(u.name||'Signed in')}</div>`+
        `<div class="whoem">${esc(u.email||'')}</div>`+
        (linked?`<div class="whovia">via ${esc((ME.upstream||'').replace(/^https?:\/\//,''))}</div>`:'')+
      `</div>`+
      `<button class="whoitem" id="whomine" role="menuitem">My Skills</button>`+
      `<button class="whoitem danger" id="whoout" role="menuitem">${linked?'Disconnect':'Sign out'}</button>`+
    `</div>`;
  const btn=document.getElementById('whobtn'),menu=document.getElementById('whomenu');
  const shut=()=>{menu.classList.remove('on');btn.setAttribute('aria-expanded','false');};
  btn.onclick=e=>{e.stopPropagation();const on=!menu.classList.contains('on');
    menu.classList.toggle('on',on);btn.setAttribute('aria-expanded',String(on));};
  document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==btn)shut();});
  addEventListener('keydown',e=>{if(e.key==='Escape')shut();});
  document.getElementById('whomine').onclick=()=>{shut();show('mine');};
  document.getElementById('whoout').onclick=async()=>{shut();
    if(linked){await POST('/api/link/forget',{});ME=await loadMe();FAVS=new Set();}
    else await signOut();
    paintMe();if(viewOn('mine'))renderMine();if(viewOn('browse'))loadList();};}
async function refreshFavs(){
  if(!signedIn()){FAVS=new Set();return;}
  try{const m=await API('/api/mine');FAVS=new Set((m.favorites||[]).map(s=>s.id));}catch(e){FAVS=new Set();}}

function show(v){
  if(v!=='graph'){const sp=document.getElementById('skillpage');if(sp)sp.classList.remove('on');}
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='browse'&&!R.browse){renderBrowse();R.browse=1;}
  if(v==='add'&&!R.add){renderAdd();R.add=1;}
  if(v==='mine'){renderMine();}
  if(v==='graph'){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==='graph'));
    API('/api/list?sort=shared').then(d=>{const t=(d.items||[])[0];if(t)openSkill(t.id);});}}
const R={};
/* the landing page routes by hash: #graph #graph=<id> #browse #browse=<activity> #add #mine #dups #q=… */
function applyHash(){
  if((location.hash||'')==='#signin'){show('mine');
    setTimeout(()=>{if(!signedIn())askSignIn('Sign in to keep your own list.');},80);return true;}
  const h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  if(!h) return false;
  const toBrowse=st=>{show('browse');const go=()=>{BR=Object.assign({dim:'pop',val:null,page:0,q:'',vq:'',sort:'pop',has:''},st);loadList();};
    if(!R.browse){renderBrowse().then(()=>{R.browse=1;go();});}else go();};
  if(h.startsWith('q=')){const q=h.slice(2);const b=document.getElementById('q');if(b)b.value=q;toBrowse({q});return true;}
  if(h==='dups'){toBrowse({sort:'dups',has:'dups'});return true;}
  if(h.startsWith('browse=')){const v=h.slice(7);show('browse');
    const go=()=>selectDim('activity',v);
    if(!R.browse){renderBrowse().then(()=>{R.browse=1;go();});}else go();return true;}
  if(h==='graph'||h.startsWith('graph=')){
    const want=h.startsWith('graph=')?parseInt(h.slice(6),10):NaN;
    if(!isNaN(want))openSkill(want);
    else API('/api/list?sort=shared').then(d=>{const t=(d.items||[])[0];if(t)openSkill(t.id);});
    return true;}
  if(['add','mine','browse'].includes(h)){show(h);return true;}
  return false;}
addEventListener('hashchange',applyHash);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{show(b.dataset.v);closeNav();});
window.closeNav=()=>{};                 // defined for real below; the nav buttons call it either way
(function(){const t=document.getElementById('navtgl'),nv=document.getElementById('nav');
  if(!t||!nv)return;
  window.closeNav=()=>{nv.classList.remove('open');t.setAttribute('aria-expanded','false');};
  t.onclick=e=>{e.stopPropagation();const on=!nv.classList.contains('open');
    nv.classList.toggle('open',on);t.setAttribute('aria-expanded',String(on));};
  document.addEventListener('click',e=>{if(!nv.contains(e.target)&&e.target!==t)closeNav();});
  addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});})();
// the choice is shared with the landing page and survives a reload
(function(){const r=document.documentElement,btn=document.getElementById('theme');
  const cur=()=>r.getAttribute('data-theme')||'dark';
  const paint=()=>{if(btn)btn.textContent=cur()==='dark'?'☾':'☀';};
  paint();   // <head> already applied the stored choice before first paint
  if(btn)btn.onclick=()=>{const t=cur()==='dark'?'light':'dark';
    r.setAttribute('data-theme',t);try{localStorage.setItem('sf-theme',t);}catch(e){}
    paint();
    if(SP.id>=0)loadSPGraph(true);            // the graph bakes colours in at draw time
    if(R.browse)loadList();};})();

/* ===== force layout (synchronous settle) ===== */
function layout(nodes,edges,W,H,iters,center){const idx={};nodes.forEach(n=>idx[n.id]=n);
  // Seeding on a golden-angle spiral and stopping there is what made the neighbourhood look
  // mechanical — every node on a perfect arc. The spiral is still the seed (it keeps `same` and
  // `contain` nearest the centre), but it is jittered and then relaxed, so the result settles the
  // way the landing-page graph looks: even, but not laid out on rails.
  const rnd=s=>{const x=Math.sin(s*127.1+11.7)*43758.5453;return x-Math.floor(x);};   // stable per id
  const P={},ids=nodes.map(n=>n.id);
  const cx=W/2,cy=H/2,pinned=(center!=null&&idx[center]!=null)?center:null;
  if(pinned!=null){
    const prio={same:0,contain:1,intersect:2,near:3},best={};
    edges.forEach(e=>{const j=e.a===center?e.b:(e.b===center?e.a:null);if(j==null)return;
      const p=prio[e.type]!=null?prio[e.type]:4;if(best[j]==null||p<best[j])best[j]=p;});
    const ord=nodes.map((n,i)=>({n,i})).filter(o=>o.n.id!==center)
      .sort((a,b)=>{const pa=best[a.n.id]!=null?best[a.n.id]:5,pb=best[b.n.id]!=null?best[b.n.id]:5;
        return pa-pb||a.i-b.i;});
    const GA=Math.PI*(3-Math.sqrt(5)),m=ord.length,Rx=W*0.42,Ry=H*0.42;
    P[center]=[cx,cy];
    ord.forEach((o,r)=>{const t=Math.sqrt((r+1)/(m+1)),a=r*GA+ (rnd(o.n.id)-0.5)*0.9;
      const rr=t*(0.78+rnd(o.n.id*3.1)*0.44);
      P[o.n.id]=[cx+Rx*rr*Math.cos(a),cy+Ry*rr*Math.sin(a)];});
  } else {
    nodes.forEach((n,i)=>{const a=2*Math.PI*i/nodes.length+(rnd(n.id)-0.5)*0.7;
      const rr=0.3*(0.8+rnd(n.id*5.7)*0.4);
      P[n.id]=[cx+Math.cos(a)*W*rr,cy+Math.sin(a)*H*rr];});
  }
  // Repulsion scaled to the canvas pushed everything onto the walls, and a rectangular clamp then
  // lined them up along the edges — that is where the box came from. Spacing is capped, the disc is
  // held by an elliptical clamp, and each node remembers the radius it was seeded at.
  const k=Math.max(26,Math.min(78,Math.sqrt(W*H/Math.max(1,nodes.length))*0.5))*(nodes.length>140?1.5:1);
  const Ex=W*0.45,Ey=H*0.45,seedR={};
  ids.forEach(i=>{seedR[i]=Math.hypot((P[i][0]-cx)/Ex,(P[i][1]-cy)/Ey);});
  const IT=pinned!=null?Math.max(70,Math.min(iters,nodes.length>200?90:150)):iters;
  for(let it=0;it<IT;it++){const dsp={};ids.forEach(i=>dsp[i]=[0,0]);
    for(let x=0;x<ids.length;x++)for(let y=x+1;y<ids.length;y++){
      const a=ids[x],b=ids[y];let dx=P[a][0]-P[b][0],dy=P[a][1]-P[b][1];

/* ===== cards ===== */
function favBtn(id){const on=FAVS.has(id);return `<button class="favb ${on?'on':''}" data-fav="${id}" title="Save to My Skills">${on?'♥':'♡'}</button>`;}
function cardHTML(s){return `<div class="card" data-id="${s.id}"><div class="top"><span class="nm">${esc(s.name)}</span>`+
    (s.author?`<span class="by" style="font-family:var(--mono);font-size:10.5px;color:var(--muted)">${esc(s.author)}</span>`:'')+
  (s.pop?`<span class="pop" title="${esc(popLabel(s))}">${popIcon(s)} <b>${fmt(s.pop)}</b></span>`:'')+favBtn(s.id)+`</div><div class="sum">${esc(s.summary||'')}</div>`+
  `<div class="meta"><span class="tag act" style="background:${actCol(s.activity)}">${esc(s.activity)}</span><span class="tag cap">${esc(s.capability)}</span>`+
  (s.tech||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+relBadges(s)+
  (s.updated?`<span class="relb" title="last updated">⟳ ${esc(s.updated.slice(0,7))}</span>`:'')+`</div></div>`;}
// the popularity number is not one quantity: clawhub reports a skill's own installs, the rest report
// the star count of the whole repository. Say which, rather than printing a bare number.
function popIcon(s){return s.pop_src==='clawhub_downloads'?'⤓':'★';}
function popLabel(s){return s.pop_src==='clawhub_downloads'?'installs of this skill (ClawHub)':'stars of the repository this skill lives in';}
function relBadges(s){const r=s.rel||{};let h='';
  if(r.same)h+=`<span class="relb dup" title="near-duplicates of this skill">≡ ${r.same}</span>`;
  if(r.intersect)h+=`<span class="relb" title="skills sharing ≥2 workflow operations">⊓ ${r.intersect}</span>`;
  if(r.contain)h+=`<span class="relb" title="strict superset / subset relations">⊑ ${r.contain}</span>`;
  return h;}
function wireCards(root){root.querySelectorAll('.card').forEach(c=>{c.onclick=e=>{if(e.target.closest('.favb'))return;openSkill(+c.dataset.id);};});
  root.querySelectorAll('.favb').forEach(b=>b.onclick=async e=>{e.stopPropagation();
    const id=+b.dataset.fav;const r=await POST('/api/fav',{id});
    if(!r||r.error){askSignIn('Sign in to save this skill.');return;}
    if(r.on)FAVS.add(id);else FAVS.delete(id);b.classList.toggle('on',r.on);b.textContent=r.on?'♥':'♡';});}

/* ===== full-screen skill page (interactive neighbourhood graph + sim slider) ===== */

         (s.url?`<span>·</span><a class="osrc" href="${esc(s.url)}" target="_blank" rel="noopener">source ↗</a>`:'')+`</div>`;}

  const hd=document.querySelector('.listhead');if(hd)hd.style.display='';
  document.getElementById('lh').textContent=BR.q?`Search: “${BR.q}”`:(BR.val||'All skills');
  const lc=document.getElementById('lc');
  if(lc)lc.textContent=(d.total||0).toLocaleString()+(d.total===1?' skill':' skills');
  document.getElementById('ln').innerHTML=
    'sorted by '+ddHTML('sortsel',(d.sorts||[]).map(x=>[x.k,x.label]),d.sort||'pop')+
    ' showing '+ddHTML('hassel',HASOPTS,BR.has||'');
  wireDD('sortsel',v=>{BR.sort=v;BR.page=0;loadList();});
  wireDD('hassel', v=>{BR.has=v; BR.page=0;loadList();});
  el.innerHTML=d.items.length?d.items.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">No skills match.</div>';wireCards(el);
  const pages=Math.ceil(d.total/d.size),pg=document.getElementById('pager');
  pg.innerHTML=pages>1?`<button ${BR.page<=0?'disabled':''} id="prev">← prev</button><button disabled style="border:0;background:none">${BR.page+1} / ${pages}</button><button ${BR.page>=pages-1?'disabled':''} id="next">next →</button>`:'';
  const pv=document.getElementById('prev'),nx=document.getElementById('next');if(pv)pv.onclick=()=>{BR.page--;loadList();};if(nx)nx.onclick=()=>{BR.page++;loadList();};}
let sT;document.addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(sT);
  const q=e.target.value.trim();
  sT=setTimeout(async()=>{show('browse');if(!R.browse){await renderBrowse();R.browse=1;}
    BR={dim:BR.dim,val:null,page:0,q,vq:BR.vq,sort:BR.sort,has:BR.has,vall:BR.vall};
    renderVals();                      // a query hides the grid; clearing it brings the grid back
    if(q||BR.dim==='pop')loadList();else clearList();},220);});
function selectDim(dim,val){show('browse');const go=()=>{BR={dim,val,page:0,q:'',vq:'',sort:BR.sort||'pop',has:BR.has||''};(document.getElementById('q')||{}).value='';
  const seg=document.getElementById('seg');if(seg)seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.d===dim));
  renderVals();                        // BR.val is already set, so this draws the way-back, not the grid
  if(val||dim==='pop')loadList();else clearList();};
  if(!R.browse){renderBrowse().then(()=>{R.browse=1;go();});}else go();}

/* ===== ADD YOUR SKILL (md pipeline) ===== */
// The public site cannot run this: it ships without the embeddings and without a key, so the
// honest thing is to say so up front rather than let someone paste a file and hit a 503.
let CAPS=null;
async function renderAdd(){const el=document.getElementById('v-add');
  try{CAPS=await API('/api/caps');}catch(e){CAPS={add:false,why:{}};}   // re-read: a restart can change it
  if(!CAPS.add)return renderAddLocalOnly(el);
  el.innerHTML=`<h1>Add My Skill to the graph</h1><p class="lede">Drop your <b>SKILL.md</b> or paste it in full. Everything is extracted from the file itself — you label nothing. About 20 seconds.</p>`+
   `<div class="addwrap"><div class="form">
     <div class="drop" id="drop">⬆ Drop a <b>SKILL.md</b> here, or click to choose<input type="file" id="file" accept=".md,.markdown,.txt" hidden></div>
     <div class="orline"><span>or paste the file</span></div>
     <textarea id="a-md" class="mdbox" spellcheck="false" placeholder="---&#10;name: pr-security-reviewer&#10;description: Reviews PR diffs for injection flaws and leaked secrets.&#10;---&#10;&#10;## Workflow&#10;1. Fetch the pull-request diff&#10;2. Run semgrep over the changed files&#10;3. Post inline findings that gate the PR"></textarea>
     <div id="fname" class="hint"></div>
     <button class="btn" id="a-go">◈ Run pipeline → place in graph</button>
     <div class="hint" style="margin-top:9px">The pipeline reads the raw file and extracts the <b>function, steps, tech, activity and object</b> itself, then embeds it, finds neighbours, and types the relations.</div>
   </div><div id="a-res"><div class="empty">Your skill's place in the graph will appear here.</div></div></div>`;
  const drop=document.getElementById('drop'),file=document.getElementById('file'),box=document.getElementById('a-md');
  drop.onclick=()=>file.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);};
  file.onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);};
  // a dropped file simply fills the box, so there is one source of truth for what gets sent
  function readFile(f){const r=new FileReader();
    r.onload=()=>{box.value=r.result;document.getElementById('fname').textContent='✓ '+f.name+' — '+r.result.length.toLocaleString()+' characters loaded';};
    r.readAsText(f);}
  box.addEventListener('input',()=>{document.getElementById('fname').textContent='';});
  document.getElementById('a-go').onclick=()=>placeSkill(box.value.trim());}
let LAST=null;
async function placeSkill(md){const btn=document.getElementById('a-go'),res=document.getElementById('a-res');
  if(!md){res.innerHTML='<div class="empty">Drop a SKILL.md, or paste its contents above.</div>';return;}
  const body={md};
  const uname=(md.match(/^\s*name:\s*(.+)$/m)||[])[1] || (md.match(/^#\s+(.+)$/m)||[])[1] || 'your skill';
  btn.disabled=true;btn.textContent='Running…';
  res.innerHTML=`<div class="pipe"><div class="st on">1 · label</div><div class="st">2 · embed</div><div class="st">3 · neighbours</div><div class="st">4 · relations</div></div><div class="empty"><span class="spin"></span><div style="margin-top:12px">labelling → embedding → finding neighbours → typing relations…</div></div>`;
  try{const r=await POST('/api/place',body);if(r.error){res.innerHTML=`<div class="empty">${esc(r.error)}</div>`;}else{LAST={...r,_name:(uname||(r.labels&&r.labels.name)||'your skill'),_body:body};renderPlacement(LAST);}}
  catch(e){res.innerHTML='<div class="empty">Something went wrong. Is the backend running?</div>';}
  btn.disabled=false;btn.textContent='◈ Run pipeline → place in graph';}
function renderPlacement(r){const res=document.getElementById('a-res');const nm=r._name;const typed=r.neighbours.filter(n=>n.type);
  const L=r.labels;const labelCard=L?`<div class="labelcard"><div class="eyebrow" style="margin:0 0 8px">Stage 1 · extracted labels</div>`+
    [['fine',L.fine],['summary',L.summary],['activity',L.activity],['object',L.object],['steps',(L.steps||[]).join(' › ')],['tech',(L.tech||[]).join(', ')],['concern',(L.concern||[]).join(', ')]].filter(x=>x[1]).map(x=>`<div class="lrow"><div class="lk">${x[0]}</div><div>${esc(x[1])}</div></div>`).join('')+`</div>`:'';
  res.innerHTML=`<div class="pipe"><div class="st done">1 · label</div><div class="st done">2 · embed</div><div class="st done">3 · neighbours</div><div class="st done">4 · relations</div></div>`+
    labelCard+
    `<div class="sugg"><div class="suggc"><div class="l">Best-fit activity</div><div class="v" style="color:${actCol(r.suggested_activity)}">${esc(r.suggested_activity)}</div></div>`+
    `<div class="suggc"><div class="l">Best-fit capability</div><div class="v">${esc(r.suggested_capability)}</div></div>`+
    `<div class="suggc"><div class="l">Typed relations</div><div class="v">${typed.length} / ${r.neighbours.length}</div></div></div>`+
    `<div class="legend"><span><span class="dot" style="background:${cssv('--contain')}"></span>contain</span><span><span class="dot" style="background:${cssv('--same')}"></span>same</span><span><span class="dot" style="background:${cssv('--inter')}"></span>intersect</span><span style="color:var(--muted)">hollow = candidate</span></div>`+
    `<div class="ngraph" style="border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px;position:relative"><div id="pg"></div><div class="sphint" style="position:absolute">click a node = full info · click centre = full graph</div></div>`+
    `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px"><button class="btn" id="openfull" style="width:auto;margin:0;padding:9px 18px">◈ Open full graph →</button>`+
      `<span id="savedmsg" class="hint" style="align-self:center">saving to <b>My Skills</b>…</span></div>`+
    `<div class="eyebrow">Nearest skills</div><div class="grid" style="grid-template-columns:1fr">`+r.neighbours.slice(0,20).map(n=>{const col=n.type?cssv(REL[n.type]):'var(--muted)';const d=n.type==='contain'?(n.broader==='new'?' ⊇ yours':(n.broader==='cand'?' ⊆ yours':'')):'';
      return `<div class="card" data-id="${n.id}"><div class="top"><span class="nm">${esc(n.name)}</span><span class="pop mono" style="color:${col}">${n.type?esc(n.type)+d:'candidate'} · ${n.sim.toFixed(2)}</span></div><div class="sum" style="min-height:0">${esc(n.summary)}</div><div class="meta"><span class="tag act" style="background:${actCol(n.activity)}">${esc(n.activity)}</span><span class="tag cap">${esc(n.capability)}</span></div></div>`;}).join('')+`</div>`;
  res.querySelectorAll('.card').forEach(c=>c.onclick=()=>openSkill(+c.dataset.id));
  const shown=r.neighbours.slice(0,20),sset=new Set(shown.map(n=>n.id));
  const cn={id:-1,name:nm,activity:r.suggested_activity,pop:0},nodes=[cn].concat(shown.map(n=>({id:n.id,name:n.name,activity:n.activity,pop:n.pop})));
  const star=shown.map(n=>({a:-1,b:n.id,type:n.type||'intersect',sim:n.sim||0.75,
    dir:n.type==='contain'?(n.broader==='new'?1:(n.broader==='cand'?-1:0)):0}));
  const among=(r.neigh_edges||[]).filter(e=>sset.has(e.a)&&sset.has(e.b)).map(e=>({a:e.a,b:e.b,type:e.type,sim:e.sim,dir:e.dir||0}));
  drawForce(document.getElementById('pg'),nodes,star.concat(among),{W:720,H:340,center:-1,colorEdge:true,colorNode:n=>n.id===-1?cssv('--accent'):actCol(n.activity),onClick:n=>{if(n.id>=0)showFullInfo(n.id);else openPlacedFull();}});
  document.getElementById('openfull').onclick=openPlacedFull;
  // a skill you placed is yours — it lands in My Skills without asking
  (async()=>{try{
    const rec={name:nm,summary:(L&&L.summary)||'',steps:(L&&L.steps)||[],tech:(L&&L.tech)||[],
      activity:r.suggested_activity,capability:r.suggested_capability,labels:L,
      neighbours:r.neighbours,neigh_edges:r.neigh_edges,ts:Date.now()};
    // linked to an upstream: the skill belongs to that account, so it goes straight there and
    // is on every other device you sign in from. Otherwise it stays in this instance.
    if(ME&&ME.linked){const u=await POST('/api/sync',rec);
      const t=document.getElementById('savedmsg');
      if(t)t.innerHTML=u&&u.ok?`✓ Synced to <b>${esc(ME.linked.email||'your account')}</b>`
                              :'⚠ Saved locally — sync failed';
      if(!(u&&u.ok))await POST('/api/save',rec);
      return;}
    await POST('/api/save',rec);
    const t=document.getElementById('savedmsg');
    if(t)t.innerHTML='✓ Saved to <b>My Skills</b>';
  }catch(_){}})();}
function openPlacedFull(){if(!LAST)return;const L=LAST.labels;showAdded({name:LAST._name,summary:(L&&L.summary)||'',steps:(L&&L.steps)||[],tech:(L&&L.tech)||[],activity:LAST.suggested_activity,capability:LAST.suggested_capability,neighbours:LAST.neighbours,neigh_edges:LAST.neigh_edges});}

/* ===== MY SKILLS ===== */
async function renderMine(){const el=document.getElementById('v-mine');el.innerHTML='<div class="empty"><span class="spin"></span></div>';
  if(!signedIn())await loadMe();
  if(!signedIn()){
    el.innerHTML=`<h1>My Skills</h1><p class="lede">Your saved skills live with your account.</p>`+
      `<div class="localonly" style="max-width:540px"><p>A saved skill has to belong to somebody. `+
      `Sign in and this page becomes your own list — nobody else can see it or change it.</p>`+
      `<p>Everything else here works without an account: browsing, search, and every skill's `+
      `relation graph.</p><div class="lofoot">`+
      `<button class="btn" style="width:auto;margin:0" onclick="askSignIn('Sign in to keep your own list.')">Sign in</button>`+
      `<button class="lobrowse" onclick="show('browse')">Browse the graph instead →</button>`+
      `</div></div>`;
    return;}
  const m=await API('/api/mine');MINE=m;FAVS=new Set(m.favorites.map(s=>s.id));
  el.innerHTML=`<h1>My Skills</h1><p class="lede">Skills you saved from the market, and skills you added yourself.</p>`+
    `<div class="eyebrow">Added by you · ${m.added.length}</div><div class="grid" id="mineadd"></div>`+
    `<div class="eyebrow">Favourites · ${m.favorites.length}</div><div class="grid" id="minefav"></div>`;
  const add=document.getElementById('mineadd');
  add.innerHTML=m.added.length?m.added.map((s,i)=>`<div class="card" data-i="${i}"><button class="favb on" data-del="${s._id}" title="Remove">✕</button><div class="top"><span class="nm">${esc(s.name)}</span></div><div class="sum">${esc(s.summary)}</div><div class="meta"><span class="tag act" style="background:${actCol(s.activity)}">${esc(s.activity)}</span><span class="tag cap">${esc(s.capability)}</span><span class="tag">${(s.neighbours||[]).length} relations</span></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Nothing yet — go to <b>Add My Skill</b> and save one.</div>';
  add.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-del]'))return;
    showAddedInfo(+c.dataset.i);});   // the card opens the card, as it does everywhere else
  add.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.stopPropagation();
    await POST('/api/remove_added',{id:+b.dataset.del});renderMine();});
  const fav=document.getElementById('minefav');fav.innerHTML=m.favorites.length?m.favorites.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">No favourites — tap ♡ on any skill.</div>';wireCards(fav);}
let SPA={min:0.70,s:null,_t:null};
function showAdded(s){const el=document.getElementById('skillpage');const typed=(s.neighbours||[]).filter(n=>n.type);
  const sims=(s.neighbours||[]).map(n=>n.sim||0);
  const lo=sims.length?Math.floor(Math.min(...sims)*100)/100:0.70,hi=Math.max(0.90,...sims);
  const start=Math.min(Math.max(autoMinsim(sims),lo),hi);   // same rule as a skill's own page
  SPA={min:start,s,_t:null};
  el.innerHTML=`<div class="sptop"><button class="spback" onclick="closeSkill()">←</button><span class="sptitle">${esc(s.name)}</span><span class="tag">yours</span>`+
    `<span class="tag act" style="background:${actCol(s.activity)}">${esc(s.activity)}</span><span class="tag cap">${esc(s.capability)}</span>`+
    `<span class="spslider">similarity ≥ <b id="spsv">${start.toFixed(2)}</b><input type="range" id="spsl" min="${lo}" max="${hi.toFixed(2)}" step="0.01" value="${start}">`+
    `<span style="display:flex;gap:9px;margin-left:4px"><span><span class="dot" style="background:${cssv('--contain')}"></span>contain</span><span><span class="dot" style="background:${cssv('--same')}"></span>same</span><span><span class="dot" style="background:${cssv('--inter')}"></span>intersect</span></span></span></div>`+
    `<div class="spbody"><div class="spgraph"><div id="spg" style="width:100%;height:100%"></div><div class="spgcount" id="spgc"></div></div>`+
    `<div class="spdrag" id="spdrag" title="drag to resize"></div>`+
    `<div class="sppanel"><div class="dsum">${esc(s.summary)}</div>`+
    ((s.steps||[]).length?`<div class="steps">${s.steps.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'')+
    `<div class="relsec"><div class="relhead"><span class="dot" style="background:${cssv('--inter')}"></span>`+
      `Typed relations<b class="relcount">${typed.length}</b></div><div class="relrows">`+
    (s.neighbours||[]).map(n=>{const col=n.type?cssv(REL[n.type]):'var(--muted)';
      const d=n.type==='contain'?(n.broader==='new'?'⊇':(n.broader==='cand'?'⊆':'')):'';
      return `<div class="relrow" data-id="${n.id}"><span class="rb" style="background:${col}">${n.type||'cand'}</span>`+
        `<span class="rdir">${d}</span><span class="rn">${esc(n.name)}</span>`+
        `<span class="rs">${(n.sim||0).toFixed(2)}</span></div>`;}).join('')+
    `</div></div></div></div>`;
  el.querySelectorAll('.relrow').forEach(r=>r.onclick=()=>showFullInfo(+r.dataset.id));
  wireSplit();
  const sl=document.getElementById('spsl');sl.oninput=e=>{SPA.min=+e.target.value;document.getElementById('spsv').textContent=SPA.min.toFixed(2);clearTimeout(SPA._t);SPA._t=setTimeout(()=>drawAdded(true),110);};
  drawAdded(false);el.classList.add('on');}
function drawAdded(quick){const s=SPA.s;const ns=(s.neighbours||[]).filter(n=>n.type==='same'||n.type==='contain'||(n.sim||0)>=SPA.min).slice(0,80);const sset=new Set(ns.map(n=>n.id));
  const cn={id:-1,name:s.name,activity:s.activity,pop:0},nodes=[cn].concat(ns.map(n=>({id:n.id,name:n.name,activity:n.activity,pop:n.pop})));
  const star=ns.map(n=>({a:-1,b:n.id,type:n.type||'intersect',sim:n.sim||0.75,
    dir:n.type==='contain'?(n.broader==='new'?1:(n.broader==='cand'?-1:0)):0}));
  const among=(s.neigh_edges||[]).filter(e=>sset.has(e.a)&&sset.has(e.b)).map(e=>({a:e.a,b:e.b,type:e.type,sim:e.sim,dir:e.dir||0}));
  const edges=star.concat(among);
  drawForce(document.getElementById('spg'),nodes,edges,{W:1160,H:800,center:-1,colorEdge:true,dur:quick?150:300,colorNode:n=>n.id===-1?cssv('--accent'):actCol(n.activity),onClick:n=>{if(n.id>=0)showFullInfo(n.id);}});
  const c=document.getElementById('spgc');if(c)c.textContent=`${nodes.length} skills · ${edges.length} relations`;}

/* boot */
loadMe().then(async()=>{paintMe();await refreshFavs();if(!applyHash())show('browse');});
</script>
