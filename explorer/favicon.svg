<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The wordmark's node glyph, redrawn for 16px. The header logo is 2.6px strokes on a 38
       viewBox, which lands under a pixel at favicon size; here the strokes are ~11% of the
       canvas and the terminals are large enough to keep their colours apart. The plate is
       needed too — an unfilled mark disappears against a dark browser chrome. -->
  <rect width="32" height="32" rx="7.5" fill="#17171C"/>
  <g stroke-linecap="round" stroke-width="3.2">
    <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#14B8A6"/>
    <line x1="16" y1="6.5" x2="16" y2="25.5" stroke="#6D82F0"/>
  </g>
  <circle cx="6.5"  cy="16"   r="3.5" fill="#E84040"/>
  <circle cx="25.5" cy="16"   r="3.5" fill="#8B5CF6"/>
  <circle cx="16"   cy="6.5"  r="3.5" fill="#22C55E"/>
  <circle cx="16"   cy="25.5" r="3.5" fill="#F97316"/>
  <circle cx="16"   cy="16"   r="5.6" fill="#2847E0"/>
  <circle cx="14.4" cy="14.4" r="1.35" fill="#FFFFFF" opacity="0.45"/>
</svg>
